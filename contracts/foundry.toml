[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
ffi = false
deny = "never"

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"

[etherscan]
coston2 = { key = "${ETHERSCAN_API_KEY}", url = "https://coston2-explorer.flare.network/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
